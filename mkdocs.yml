site_name: NomosGuard
site_description: >-
  Deterministic security reasoning core: a hash-chained evidence ledger, an
  attack-path rule engine, and a fail-closed policy gate.
site_author: Furox-Art
repo_url: https://github.com/Furox-Art/nomosguard
repo_name: Furox-Art/nomosguard
copyright: Apache-2.0 licensed.

docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
