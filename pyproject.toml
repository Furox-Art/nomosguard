[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nomosguard"
version = "0.7.10"
description = "Deterministic security reasoning core: hash-chained evidence ledger, attack-path rule engine, and a fail-closed policy gate. LLMs may produce evidence and explain decisions; they never cross the decision boundary."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Furox-Art", email = "177975472+Furox-Art@users.noreply.github.com" },
]
keywords = [
    # what it does
    "security", "deterministic", "evidence-ledger", "policy-gate",
    "attack-graph", "fail-closed", "hash-chain", "tamper-evident",
    "rule-engine", "reasoning",
    # integration
    "llm", "agent-skills", "mcp-server", "tool-call-guard",
    "ai-security", "agent-security",
    # discipline
    "zero-dependencies", "pure-python", "reproducible", "audit-log",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nomosguard = "nomosguard.cli:main"

[project.urls]
Homepage = "https://github.com/Furox-Art/nomosguard"
Documentation = "https://github.com/Furox-Art/nomosguard/blob/main/README.md"
Repository = "https://github.com/Furox-Art/nomosguard"

[tool.hatch.build.targets.wheel]
packages = ["src/nomosguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
# `coverage run --source=src/nomosguard -m pytest` reports 4730 statements,
# 0 missed (1361 tests) on this tree, but nothing enforced it. Recording the
# floor makes a plain `coverage report` fail when the floor is not met.
# Branch coverage is not enabled: it was never measured.
fail_under = 100
