name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/nomosguard/**"
      - "tests/fuzz/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per ref: a PR run must not cancel the main-branch run (or another PR's run),
  # which otherwise reports a false red fuzz check; superseded runs still cancel.
  group: fuzz-nomosguard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Atheris
        run: python -m pip install atheris==3.1.0
      - name: Install nomosguard
        run: python -m pip install -e .
      - name: Fuzz tool-call JSONL parser
        run: python tests/fuzz/fuzz_toolcall_jsonl.py -max_total_time=60 -rss_limit_mb=2048 -print_final_stats=1
