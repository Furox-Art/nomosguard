name: Release to PyPI

# Fires when a GitHub Release is published. The trusted OIDC publisher must
# be registered on PyPI (pypi.org/manage/account/publishing) for:
#   project: nomosguard
#   owner:   Furox-Art
#   repo:    nomosguard
#   workflow: release-pypi.yml
#   environment: pypi
# Before that registration, the publish step fails with invalid-publisher —
# that is expected on the first run; register, then re-publish the release.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Verify the version matches the release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "release tag: $TAG, package version: $PKG_VER"
          test "$TAG" = "$PKG_VER"
      - name: Install built wheel in a clean venv and run the full test suite
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet --no-deps dist/*.whl pytest
          # zero runtime dependencies: prove the installed package runs on stdlib alone
          /tmp/clean/bin/python -c "import nomosguard; print('import OK', nomosguard.__version__)"
          /tmp/clean/bin/python -m nomosguard.demo > /dev/null && echo "demo OK"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI via trusted OIDC
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # OIDC token for trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Build distributions
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
