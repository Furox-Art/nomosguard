name: Release to PyPI

# Fires when a GitHub Release is published. The trusted OIDC publisher must
# be registered on PyPI (pypi.org/manage/account/publishing) for:
#   project: nomosguard
#   owner:   Furox-Art
#   repo:    nomosguard
#   workflow: release-pypi.yml
#   environment: pypi
# Before that registration, the publish step fails with invalid-publisher —
# that is expected on the first run; register, then re-publish the release.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        # Pinned instead of `--upgrade build twine`: the artifacts tested here
        # are the ones published, so the toolchain that produced them must not
        # depend on the day CI ran. twine >= 7.0.0 is required because 6.x
        # hardcodes a metadata-version list ending at 2.4 and rejects the
        # Metadata-Version newer hatchling emits.
        run: python -m pip install "build==1.6.1" "twine==7.0.0"
      - name: Build sdist and wheel
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Verify the version matches the release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "release tag: $TAG, package version: $PKG_VER"
          test "$TAG" = "$PKG_VER"
      - name: Install built wheel in a clean venv and run the full test suite
        run: |
          python -m venv /tmp/clean
          # --no-deps applies to the wheel only: it proves nomosguard itself
          # needs nothing beyond the stdlib. pytest then brings its own deps.
          /tmp/clean/bin/pip install --quiet --no-deps dist/*.whl
          /tmp/clean/bin/pip install --quiet pytest
          # zero runtime dependencies: prove the installed package runs on stdlib alone
          /tmp/clean/bin/python -c "import nomosguard; print('import OK', nomosguard.__version__)"
          /tmp/clean/bin/python -m nomosguard.demo > /dev/null && echo "demo OK"
          # the tests import the INSTALLED wheel (src/ is never on sys.path here),
          # so the released artifact is what the suite proves
          /tmp/clean/bin/python -m pytest tests/ -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI via trusted OIDC
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # OIDC token for trusted publishing
    steps:
      # Publish exactly the artifacts the build job built, checked and tested.
      # Rebuilding in this job silently replaced them with a second, untested
      # build, so the tested and published bytes could differ.
      - name: Download the tested distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
