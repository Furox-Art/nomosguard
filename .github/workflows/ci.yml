name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install pinned ruff
        run: python -m pip install "ruff==0.17.0"

      - name: Lint with pinned ruff (default rule set cannot drift)
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install package (zero runtime deps) and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov

      - name: Verify zero runtime dependencies
        run: |
          # The core must run with ONLY the stdlib: install into a clean
          # venv with no extra packages and run the demo.
          python -m venv /tmp/clean-env
          /tmp/clean-env/bin/pip install -q --no-deps -e .
          /tmp/clean-env/bin/python -m nomosguard.demo | python -m json.tool > /dev/null
          echo "zero-dependency demo OK"

      # Every source line and branch must be covered on every Linux interpreter;
      # a passing run may not hide unavailable, skipped tests.
      - name: Full statement and branch coverage (100% / zero skipped)
        shell: bash
        run: |
          set -euo pipefail
          pytest tests/ -q -rs --cov=nomosguard --cov-branch --cov-report=term-missing --cov-fail-under=100 | tee full-test-coverage.log
          if grep -Eq '(^|[[:space:]])[1-9][0-9]* skipped' full-test-coverage.log; then
            echo "::error::The mandatory Linux suite skipped at least one test"
            exit 1
          fi

      - name: Run demo (smoke)
        run: python -m nomosguard.demo

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run tests (exercises the msvcrt lock path)
        run: pytest tests/ -q

      - name: Run demo (smoke)
        run: python -m nomosguard.demo
