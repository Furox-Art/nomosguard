name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned ruff
        run: python -m pip install "ruff==0.17.0"

      - name: Lint (pinned version: the default rule set cannot drift)
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (zero runtime deps) and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov

      - name: Verify zero runtime dependencies
        run: |
          # The core must run with ONLY the stdlib: install into a clean
          # venv with no extra packages and run the demo.
          python -m venv /tmp/clean-env
          /tmp/clean-env/bin/pip install -q --no-deps -e .
          /tmp/clean-env/bin/python -m nomosguard.demo | python -m json.tool > /dev/null
          echo "zero-dependency demo OK"

      - name: Run tests (coverage floor: 85, measured 91)
        run: pytest tests/ -v --cov=nomosguard --cov-report=term --cov-fail-under=85

      - name: Run demo (smoke)
        run: python -m nomosguard.demo

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run tests (exercises the msvcrt lock path)
        run: pytest tests/ -q

      - name: Run demo (smoke)
        run: python -m nomosguard.demo
